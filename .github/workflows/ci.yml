name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: Install and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Start the app (as in production)
        run: |
          nohup gunicorn --worker-class gthread --workers 1 --threads 100 --timeout 120 \
            --bind 127.0.0.1:5000 wsgi:app > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:5000/api/health && exit 0
            sleep 2
          done
          echo "App did not become healthy"; cat server.log; exit 1
        env:
          FLASK_DEBUG: "0"

      - name: Pages and API respond
        run: |
          curl -fsS http://127.0.0.1:5000/ > /dev/null
          curl -fsS http://127.0.0.1:5000/multiplayer > /dev/null
          curl -fsS -X POST http://127.0.0.1:5000/api/game/start \
            -H 'Content-Type: application/json' -d '{}'
          curl -fsS "http://127.0.0.1:5000/socket.io/?EIO=4&transport=polling" | grep -q '"sid"'

      - name: Server log
        if: always()
        run: cat server.log || true
